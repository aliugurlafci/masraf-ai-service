# Override for the pre-release gate `npm run test:compose` (contract §18.5; scripts/compose-smoke.mjs).
# Never used for real deployments.
#
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml -p orc-smoke config
#
# - Claude Code is replaced by the deterministic fake CLI (tests/fixtures/fake-claude, contract §18.3),
#   mounted read-only and executed by the runner as `node fake-claude.mjs` under a sandbox uid. No
#   request ever reaches api.anthropic.com; the anthropic_api_key secret holds a generated dummy value.
# - The real codebase-memory-mcp binary of the worker image is used (offline indexing).
# - Sample repositories are generated by the smoke script into a temporary directory that is mounted
#   read-only as the projects root (ORC_PROJECTS_DIR, see docker-compose.yml).
# - The web ports are moved to loopback-only 18443 (HTTPS) / 18088 (redirect) so the smoke stack can
#   run next to a regular `orc` stack; the script sets PUBLIC_ORIGIN=https://localhost:<https port>.
# Everything else (networks, users, capabilities, read-only roots, limits, secrets) is the
# production topology of docker-compose.yml.
services:
  worker:
    environment:
      CLAUDE_BIN: /usr/local/bin/node
      CLAUDE_BIN_PREFIX_ARGS: '["/opt/orc/fake-claude/fake-claude.mjs"]'
      # The Docker Desktop VM disk is shared with other workloads; 1 GiB free is enough for the
      # tiny generated repositories (production default: 5 GiB).
      WORKSPACES_MIN_FREE_BYTES: '${ORC_SMOKE_MIN_FREE_BYTES:-1073741824}'
    volumes:
      - ./tests/fixtures/fake-claude:/opt/orc/fake-claude:ro

  runner:
    volumes:
      - ./tests/fixtures/fake-claude:/opt/orc/fake-claude:ro

  web:
    ports: !override
      - '127.0.0.1:${ORC_SMOKE_HTTPS_PORT:-18443}:8443'
      - '127.0.0.1:${ORC_SMOKE_HTTP_PORT:-18088}:8080'
