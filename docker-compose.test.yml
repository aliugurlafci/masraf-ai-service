# Disposable test infrastructure (project "orc-test"). Never use for dev or production data.
# Start: npm run infra:test:up    Stop and wipe: npm run infra:test:down
# The default passwords below are TEST-ONLY values for a loopback-bound throwaway
# container; override them with ORC_TEST_SA_PASSWORD / ORC_TEST_REDIS_PASSWORD.
name: orc-test

services:
  mssql-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${ORC_TEST_SA_PASSWORD:-OrcTestOnly_Sa_2026!}
      MSSQL_MEMORY_LIMIT_MB: '2048'
    ports:
      - '127.0.0.1:14331:1433'
    tmpfs:
      - /var/opt/mssql:uid=10001,gid=0,mode=0770
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: 'no'

  redis-test:
    image: redis:7.4-alpine
    environment:
      REDISCLI_AUTH: ${ORC_TEST_REDIS_PASSWORD:-orc-test-only-redis-pw}
    command:
      - redis-server
      - --requirepass
      - ${ORC_TEST_REDIS_PASSWORD:-orc-test-only-redis-pw}
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:16380:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: 'no'
