# nginx main configuration of the web container (contract §19, ADR-0012, ADR-0025).
# Runs as uid 101 on a read-only root filesystem: pid, temp paths and the rendered site config
# live in the /tmp tmpfs. The site itself is templates/orc/site.conf.template.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml text/plain;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_header_timeout 30s;
    client_body_timeout 30s;
    send_timeout 60s;
    # The API accepts JSON bodies up to 256 KiB (JSON_BODY_LIMIT_BYTES).
    client_max_body_size 1m;

    # JSON access log on stdout (Docker json-file driver, §17.1). $uri, not $request_uri, so
    # query strings (which may carry token-like values) never reach the log.
    log_format orc_json escape=json
        '{"time":"$time_iso8601","service":"web","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","request_id":"$request_id",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout orc_json;

    # Static assets only; /api responses are never compressed (SSE, BREACH).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /tmp/orc/site.conf;
}
