# Reverse proxy settings for the API (contract §9.1, §19, ADR-0025). Included by the /api/ and
# /health/ready locations; requires `set $api_upstream` and `resolver` in the server block.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
# TRUST_PROXY=1 in the API: exactly one hop, whose X-Forwarded-For is overwritten here.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;

# SSE (GET /api/v1/tasks/:taskId/stream) must reach the browser unbuffered and uncompressed.
proxy_buffering off;
proxy_cache off;
gzip off;
proxy_connect_timeout 5s;
proxy_send_timeout 3700s;
# > SSE_MAX_DURATION_MS (3600 s); the API sends heartbeats every 15 s.
proxy_read_timeout 3700s;

# The API sets its own headers (helmet); HSTS is owned by this TLS terminator.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Powered-By;
add_header Strict-Transport-Security "max-age=31536000" always;
