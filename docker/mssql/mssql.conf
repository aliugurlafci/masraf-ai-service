; SQL Server configuration mounted read-only at /var/opt/mssql/mssql.conf (contract §19, ADR-0026).
; TLS is mandatory for every client; the certificate (SAN "mssql") and key are compose secrets
; signed by the private CA that api, worker, db-bootstrap and migrator trust (DB_CA_CERT_FILE).
[network]
tlscert = /run/secrets/mssql_tls_cert
tlskey = /run/secrets/mssql_tls_key
tlsprotocols = 1.2
forceencryption = 1

[memory]
; 4 GiB container limit: leave room for the non-buffer-pool memory of sqlservr.
memorylimitmb = 3072
