# SQL Server for the expense service. Every value comes from .env (see .env.example).
# The port is published on 127.0.0.1 only, like the service itself.
services:
  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    # SQL Server is published for linux/amd64 only. On Apple Silicon Docker Desktop runs it
    # through Rosetta (Settings > General > "Use Rosetta for x86_64/amd64 emulation").
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:?MSSQL_PASSWORD .env dosyasinda tanimli olmali}
      # The server keeps its default collation; Turkish text columns set Turkish_100_CI_AS themselves.
    ports:
      - '127.0.0.1:${MSSQL_PORT:-1433}:1433'
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "SELECT 1" > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mssql-data:
