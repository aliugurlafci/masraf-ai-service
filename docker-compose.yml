# Production topology of the orchestrator (contract §19, ADR-0012/0013/0024/0025/0026).
#
#   npm run secrets:generate   # once: passwords, tokens, private CAs and TLS certificates
#   npm run compose:up         # build images, start, wait until healthy
#   npm run compose:down       # stop (volumes are kept)
#
# Networks: backend (internal: mssql, redis, db-bootstrap, migrator, api, worker), frontend
# (internal: web <-> api), sandbox (internal: runner <-> egress-proxy), edge (web only, publishes
# 8443/8088) and egress (egress-proxy only). Only the egress proxy can reach the internet.
# Never mounted anywhere: /var/run/docker.sock, ~/.ssh, the host root.
# Optional variables: WEB_BIND_ADDRESS, WEB_SERVER_NAME, PUBLIC_ORIGIN, ORC_SECRETS_DIR,
# ORC_PROJECTS_DIR, ORC_IMAGE_TAG, APP_VERSION, LOG_LEVEL, DB_NAME, MSSQL_PID, WORKER_CONCURRENCY,
# CLAUDE_ALLOWED_MODELS, CLAUDE_DEFAULT_MODEL, EGRESS_ALLOWED_HOSTS, MCP_ENABLED, MCP_REQUIRED.
name: orc

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

# Hardening shared by every container built from this repository (§19).
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  init: true
  logging: *logging

x-build-args: &build-args
  APP_VERSION: ${APP_VERSION:-0.1.0}

x-db-client-env: &db-client-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: mssql
  DB_PORT: '1433'
  DB_NAME: ${DB_NAME:-orchestrator}
  # Verified TLS against the private CA (ADR-0026); trusting the server certificate is refused
  # in production by the config schema.
  DB_ENCRYPT: 'true'
  DB_TRUST_SERVER_CERTIFICATE: 'false'
  DB_CA_CERT_FILE: /run/secrets/db_ca_cert

x-redis-client-env: &redis-client-env
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  REDIS_PREFIX: orc

x-sandbox-paths-env: &sandbox-paths-env
  WORKSPACES_ROOT: /var/lib/orc/workspaces
  CLAUDE_HOME_ROOT: /var/lib/orc/claude
  CBM_CACHE_DIR: /var/lib/orc/cbm-cache
  RUNNER_SOCKET_PATH: /run/orc-runner/runner.sock

services:
  mssql:
    # mcr.microsoft.com/mssql/server:2022-latest plus an mssql-owned backups mount point
    # (docker/mssql/Dockerfile). Runs as the non-root `mssql` user (uid 10001).
    # MSSQL_SA_PASSWORD is read from the compose secret instead of the compose environment.
    image: orc-mssql:${ORC_IMAGE_TAG:-local}
    build:
      context: ./docker/mssql
      dockerfile: Dockerfile
    entrypoint:
      - /bin/bash
      - -ec
      - |
        MSSQL_SA_PASSWORD="$$(cat /run/secrets/mssql_sa_password)"
        export MSSQL_SA_PASSWORD
        exec /opt/mssql/bin/launch_sqlservr.sh /opt/mssql/bin/sqlservr
    environment:
      ACCEPT_EULA: ${MSSQL_ACCEPT_EULA:-Y}
      MSSQL_PID: ${MSSQL_PID:-Express}
    secrets: [mssql_sa_password, mssql_tls_cert, mssql_tls_key]
    volumes:
      - mssql-data:/var/opt/mssql
      - mssql-backups:/var/opt/mssql/backups
      - ./docker/mssql/mssql.conf:/var/opt/mssql/mssql.conf:ro
    networks: [backend]
    cap_drop: [ALL]
    # /opt/mssql/bin/sqlservr carries the file capability cap_net_bind_service; exec fails with
    # EPERM when that capability is missing from the bounding set.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        - CMD-SHELL
        - SQLCMDPASSWORD="$$(cat /run/secrets/mssql_sa_password)" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 4g
    cpus: 2
    logging: *logging

  redis:
    image: redis:7.4-alpine
    user: '999:1000'
    # requirepass comes from the secret through a tmpfs config file (never argv); memory is bounded
    # below the container limit and never evicts BullMQ keys; AOF persists every second (§6.1).
    command:
      - sh
      - -ec
      - |
        umask 077
        printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis-auth.conf
        exec redis-server /tmp/redis-auth.conf --dir /data --maxmemory 400mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec --protected-mode yes
    secrets: [redis_password]
    volumes:
      - redis-data:/data
    tmpfs: ['/tmp:size=16m']
    networks: [backend]
    <<: *hardening
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128

  db-bootstrap:
    image: orc-db-cli:${ORC_IMAGE_TAG:-local}
    build: &db-cli-build
      context: .
      dockerfile: docker/Dockerfile
      target: db-cli
      args: *build-args
    user: '1000:1000'
    <<: *hardening
    command: [bootstrap]
    environment:
      <<: *db-client-env
      DB_USER: orc_migrator
      DB_PASSWORD_FILE: /run/secrets/db_migrator_password
      MSSQL_SA_PASSWORD_FILE: /run/secrets/mssql_sa_password
      DB_MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator_password
      DB_API_PASSWORD_FILE: /run/secrets/db_api_password
      DB_WORKER_PASSWORD_FILE: /run/secrets/db_worker_password
      DB_BACKUP_PASSWORD_FILE: /run/secrets/db_backup_password
    secrets:
      [
        mssql_sa_password,
        db_migrator_password,
        db_api_password,
        db_worker_password,
        db_backup_password,
        db_ca_cert,
      ]
    tmpfs: ['/tmp:size=64m']
    networks: [backend]
    depends_on:
      mssql:
        condition: service_healthy
    restart: 'no'
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  migrator:
    image: orc-db-cli:${ORC_IMAGE_TAG:-local}
    build: *db-cli-build
    user: '1000:1000'
    <<: *hardening
    entrypoint:
      - /bin/sh
      - -ec
      - node --enable-source-maps dist/orc-db.js migrate && exec node --enable-source-maps dist/orc-db.js seed
    environment:
      <<: *db-client-env
      DB_USER: orc_migrator
      DB_PASSWORD_FILE: /run/secrets/db_migrator_password
      CLAUDE_DEFAULT_MODEL: ${CLAUDE_DEFAULT_MODEL:-sonnet}
    secrets: [db_migrator_password, db_ca_cert]
    tmpfs: ['/tmp:size=64m']
    networks: [backend]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: 'no'
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  api:
    image: orc-api:${ORC_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
      args: *build-args
    user: '1000:1000'
    <<: *hardening
    environment:
      <<: [*db-client-env, *redis-client-env]
      DB_USER: orc_api
      DB_PASSWORD_FILE: /run/secrets/db_api_password
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8443}
      TRUST_PROXY: '1'
      COOKIE_SECURE: 'true'
      CLAUDE_ALLOWED_MODELS: ${CLAUDE_ALLOWED_MODELS:-sonnet,opus,haiku}
      CLAUDE_DEFAULT_MODEL: ${CLAUDE_DEFAULT_MODEL:-sonnet}
      MCP_ENABLED: ${MCP_ENABLED:-true}
    secrets: [db_api_password, redis_password, db_ca_cert]
    tmpfs: ['/tmp:size=64m']
    networks: [backend, frontend]
    healthcheck:
      test: [CMD, node, /opt/orc/healthcheck.mjs, 'http://127.0.0.1:4000/api/v1/health/ready']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 1g
    cpus: 1
    pids_limit: 256

  worker:
    image: orc-worker:${ORC_IMAGE_TAG:-local}
    build: &worker-build
      context: .
      dockerfile: docker/Dockerfile
      target: worker
      args: *build-args
    user: '1000:1000'
    <<: *hardening
    environment:
      <<: [*db-client-env, *redis-client-env, *sandbox-paths-env]
      DB_USER: orc_worker
      DB_PASSWORD_FILE: /run/secrets/db_worker_password
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: '4100'
      SANDBOX_MODE: runner
      PROJECTS_ROOT: /var/lib/orc/projects
      GIT_HOOKS_DIR: /opt/orc/git/empty-hooks
      CLAUDE_BIN: /usr/local/bin/claude
      # ADR-0036: oauth (default; claude_oauth_token) or api_key (anthropic_api_key). Exactly one of the two
      # credential files is non-empty (the unused one is empty = not configured); compose-check enforces it.
      CLAUDE_AUTH_MODE: ${CLAUDE_AUTH_MODE:-oauth}
      CLAUDE_CODE_OAUTH_TOKEN_FILE: /run/secrets/claude_oauth_token
      CODEBASE_MEMORY_MCP_BIN: /usr/local/bin/codebase-memory-mcp
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      # Handed only to Claude processes, with credentials from EGRESS_PROXY_TOKEN (§10.3); the
      # host name resolves only on the runner's sandbox network.
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1
      EGRESS_PROXY_TOKEN_FILE: /run/secrets/egress_proxy_token
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_REQUIRED: ${MCP_REQUIRED:-false}
    secrets: [db_worker_password, redis_password, claude_oauth_token, anthropic_api_key, egress_proxy_token, db_ca_cert]
    volumes:
      - workspaces:/var/lib/orc/workspaces
      - claude-home:/var/lib/orc/claude
      - cbm-cache:/var/lib/orc/cbm-cache
      - runner-sock:/run/orc-runner
      - ${ORC_PROJECTS_DIR:-./projects}:/var/lib/orc/projects:ro
    tmpfs: ['/tmp:size=256m']
    networks: [backend]
    healthcheck:
      test: [CMD, node, /opt/orc/healthcheck.mjs, 'http://127.0.0.1:4100/health/ready']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      runner:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 2g
    cpus: 1
    pids_limit: 512

  # Execution sandbox (§10.11, ADR-0024, ratified): the launcher is the only root process, keeps
  # exactly six capabilities, receives no secrets, mounts no projects and joins only `sandbox`.
  # Untrusted children run as per-lease uids 20000..20063 under prlimit.
  runner:
    image: orc-worker:${ORC_IMAGE_TAG:-local}
    build: *worker-build
    user: '0:0'
    <<: *hardening
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_READ_SEARCH, KILL]
    command: [node, --enable-source-maps, dist/runner.js]
    environment:
      <<: *sandbox-paths-env
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUNNER_STATE_DIR: /run/orc-runner/state
      WORKER_UID: '1000'
      WORKER_GID: '1000'
      RUNNER_UID_BASE: '20000'
      RUNNER_MAX_LEASES: '64'
    volumes:
      - workspaces:/var/lib/orc/workspaces
      - claude-home:/var/lib/orc/claude
      - cbm-cache:/var/lib/orc/cbm-cache
      - runner-sock:/run/orc-runner
    tmpfs: ['/tmp:size=1g']
    networks: [sandbox]
    healthcheck:
      test: [CMD, node, dist/runner.js, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      egress-proxy:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    # Total worker concurrency x 2 GiB + 512 MiB (§10.11 item 6).
    mem_limit: 4608m
    cpus: 2
    pids_limit: 8192

  egress-proxy:
    image: orc-egress-proxy:${ORC_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: egress-proxy
      args: *build-args
    user: '1000:1000'
    <<: *hardening
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EGRESS_HOST: 0.0.0.0
      EGRESS_PORT: '3128'
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-api.anthropic.com}
      EGRESS_ALLOWED_PORTS: '443'
      EGRESS_DENY_PRIVATE_IPS: 'true'
      EGRESS_AUTH_TOKEN_FILE: /run/secrets/egress_proxy_token
    secrets: [egress_proxy_token]
    tmpfs: ['/tmp:size=64m']
    networks: [sandbox, egress]
    healthcheck:
      test: [CMD, node, /opt/orc/healthcheck.mjs, 'http://127.0.0.1:3128/healthz']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128

  web:
    image: orc-web:${ORC_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args: *build-args
    user: '101:101'
    <<: *hardening
    environment:
      API_UPSTREAM: http://api:4000
      WEB_SERVER_NAME: ${WEB_SERVER_NAME:-localhost}
    secrets: [web_tls_cert, web_tls_key]
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:8443:8443'
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:8088:8080'
    tmpfs: ['/tmp:size=64m']
    networks: [edge, frontend]
    healthcheck:
      test: [CMD, curl, -fsSk, -o, /dev/null, 'https://127.0.0.1:8443/health/live']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  # Operator tool (not started by `up`): `npm run compose:backup` uses sqlcmd inside mssql instead;
  # this service runs `orc-db` commands such as create-admin or purge-audit as orc_migrator:
  #   docker compose run --rm db-cli create-admin --username admin
  db-cli:
    image: orc-db-cli:${ORC_IMAGE_TAG:-local}
    build: *db-cli-build
    profiles: [tools]
    user: '1000:1000'
    <<: *hardening
    environment:
      <<: *db-client-env
      DB_USER: orc_migrator
      DB_PASSWORD_FILE: /run/secrets/db_migrator_password
      CLAUDE_DEFAULT_MODEL: ${CLAUDE_DEFAULT_MODEL:-sonnet}
    secrets: [db_migrator_password, db_ca_cert]
    tmpfs: ['/tmp:size=64m']
    networks: [backend]
    restart: 'no'
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

networks:
  backend:
    internal: true
  frontend:
    internal: true
  sandbox:
    internal: true
  edge:
    driver: bridge
  egress:
    driver: bridge

volumes:
  mssql-data:
  mssql-backups:
  redis-data:
  workspaces:
  claude-home:
  cbm-cache:
  runner-sock:

# File-based secrets (./secrets, gitignored; see secrets/README.md). Containers read them from
# /run/secrets/<name> through *_FILE variables.
secrets:
  mssql_sa_password:
    file: ${ORC_SECRETS_DIR:-./secrets}/mssql_sa_password.txt
  db_migrator_password:
    file: ${ORC_SECRETS_DIR:-./secrets}/db_migrator_password.txt
  db_api_password:
    file: ${ORC_SECRETS_DIR:-./secrets}/db_api_password.txt
  db_worker_password:
    file: ${ORC_SECRETS_DIR:-./secrets}/db_worker_password.txt
  db_backup_password:
    file: ${ORC_SECRETS_DIR:-./secrets}/db_backup_password.txt
  redis_password:
    file: ${ORC_SECRETS_DIR:-./secrets}/redis_password.txt
  claude_oauth_token:
    file: ${ORC_SECRETS_DIR:-./secrets}/claude_oauth_token.txt
  anthropic_api_key:
    file: ${ORC_SECRETS_DIR:-./secrets}/anthropic_api_key.txt
  egress_proxy_token:
    file: ${ORC_SECRETS_DIR:-./secrets}/egress_proxy_token.txt
  db_ca_cert:
    file: ${ORC_SECRETS_DIR:-./secrets}/db_ca_cert.pem
  mssql_tls_cert:
    file: ${ORC_SECRETS_DIR:-./secrets}/mssql_tls_cert.pem
  mssql_tls_key:
    file: ${ORC_SECRETS_DIR:-./secrets}/mssql_tls_key.pem
  web_tls_cert:
    file: ${ORC_SECRETS_DIR:-./secrets}/web_tls_cert.pem
  web_tls_key:
    file: ${ORC_SECRETS_DIR:-./secrets}/web_tls_key.pem
